# Learning params
learning:
  total_timesteps: 50000000
  n_steps: 512
  learning_rate: 0.001
  num_envs: 10
  speed_time: 1.0
  save_model_frequency: 1000000

# Logging
log:
  log_dir: "./log_drl/"
  log_interval: 1
  throttle_duration: 0.5

# RL Algo
algo:
  name: "ppo"
  clip_range: 0.2
  batch_size: 512        # Plus stable si assez de RAM
  n_epochs: 5            # Plus d'apprentissage si environnement stable
  vf_coef: 0.5
  ent_coef: 0.01         # Réduit un peu l'exploration
  learning_rate_schedule: "linear"
  seed: 42

# Policy network
policy:
  # name: "scan"
  name: "mlagent"
  features_dim: 512
  pi_layers: [512, 512, 512]
  vf_layers: [512, 512, 512]
  activation_fn: "tanh"

# Environment observations
env:
  # name: "ros_gym_env"
  # name: "simple_env"
  name: "mlagent_env"
  max_iteration: 25000
  max_time: 90
  normalize_reward: False #True
  normalize_observation: True

  obs:
    goal: true
    scan: true
    scan_dim: 720
    scan_history: 
    humans: false

  robot:
    robot_radius: 0.35
    goal_radius: 0.3
    dist_goal_history_number: 10
    min_linear_velocity: 0.0
    max_linear_velocity: 0.5
    min_angular_velocity: -2.0
    max_angular_velocity: 2.0

  ros:
    robot_odom: "/robot_odom"
    robot_pose: "/robot_pose"
    cnn_data: "/cnn_data"
    global_goal: "/global_goal"
    cmd_vel: "/cmd_vel"
    reset_service: "/unity/reset"
